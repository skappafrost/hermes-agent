  - session_search
  - skills
  - spotify
  - stt
  - terminal
  - todo
  - tts
  - video
  - video_gen
  - vision
  - web
  - x_search
  - yuanbao
mcp_servers:
  agentmemory:
    command: C:/Users/Ha Trung/AppData/Local/hermes/scripts/agentmemory-mcp.cmd
    args: []
    env:
      AGENTMEMORY_URL: http://127.0.0.1:3111
  filesystem:
    args:
    - -y
    - '@modelcontextprotocol/server-filesystem'
    - C:\Users\Ha Trung
    command: npx
    env: {}
  google_stitch:
    headers:
      X-Goog-Api-Key: REDACTED
    url: https://stitch.googleapis.com/mcp
  playwright:
    args:
    - -y
    - '@playwright/mcp@latest'
    - --caps
    - vision
    command: npx
    env: {}
  motion:
    url: http://127.0.0.1:34217/motion/mcp
    transport: http
    enabled: false
timeouts:
  tools:
    concurrent_batch: 900
    sequential_call: 900
